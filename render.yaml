services:
  - type: web
    name: bingo-musical
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_YOUTUBE_API_KEY
        sync: false
